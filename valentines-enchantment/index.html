<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#fff1f2" />
    <title>Valentine's Enchantment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }

      body {
        font-family: "Quicksand", sans-serif;
        background-color: #fff1f2;
        overflow-x: hidden;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        min-height: 100dvh;
      }

      html {
        scroll-behavior: smooth;
      }

      .font-romantic {
        font-family: "Dancing+Script", cursive;
      }

      /* Mobile optimizations */
      @media (max-width: 640px) {
        body {
          font-size: 14px;
        }

        input,
        textarea,
        select {
          font-size: 16px !important;
        }

        button {
          -webkit-user-select: none;
          user-select: none;
        }

        /* Prevent zoom on input focus on iOS */
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        textarea {
          font-size: 16px;
        }

        /* Safe area insets for notch devices */
        .safe-area-inset {
          padding-left: max(1rem, env(safe-area-inset-left));
          padding-right: max(1rem, env(safe-area-inset-right));
          padding-top: max(1rem, env(safe-area-inset-top));
          padding-bottom: max(1rem, env(safe-area-inset-bottom));
        }
      }

      /* Smooth transitions for touch devices */
      @media (hover: none) and (pointer: coarse) {
        button,
        a {
          transition: opacity 0.2s ease-in-out;
        }

        button:active,
        a:active {
          opacity: 0.8;
        }
      }

      /* Disable animations on low-end devices */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
          "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
          "react/": "https://esm.sh/react@^19.2.4/",
          "react": "https://esm.sh/react@^19.2.4"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
